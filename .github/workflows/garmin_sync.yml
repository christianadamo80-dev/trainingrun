name: Sync Garmin Connect

on:
  schedule:
    # Esegue il sync in automatico ogni 2 ore
    - cron: '0 */2 * * *'
  workflow_dispatch: # Avvio manuale con un clic

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install garminconnect fitparse curl_cffi garth

      - name: Run Garmin Sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          python sync_garmin.py

      - name: Commit & Push Nuove Attivita
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f activities.json ]; then
            git add activities.json
            if git diff --staged --quiet; then
              echo "Nessuna nuova attività da salvare."
            else
              git commit -m "Auto-sync corse da Garmin Connect [skip ci]"
              git push origin HEAD
            fi
          else
            echo "File activities.json non generato."
          fi
