name: Sync Garmin & Push Workouts

on:
  schedule:
    - cron: '0 5 * * *'  # sincronizzazione automatica notturna
  workflow_dispatch:      # <-- FONDAMENTALE: permette l'avvio immediato dal browser

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install garminconnect

      - name: Run sync script
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          python sync_garmin.py

      - name: Commit & push updated activities
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add activities.json
          git commit -m "Auto-sync Garmin activities [skip ci]" || echo "Nessuna modifica da salvare"
          git push
