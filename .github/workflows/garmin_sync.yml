name: Sync Garmin Connect

on:
  schedule:
    # Esegue il sync in automatico ogni 2 ore
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permette di avviarlo manualmente con un clic da GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install garminconnect fitparse curl_cffi garth

      - name: Run Garmin Sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          python sync_garmin.py

      - name: Commit & Push Nuove Attivita
        run: |
          git config --global user.name "Garmin-Sync-Bot"
          git config --global user.email "bot@github.com"
          git add activities.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync corse da Garmin Connect [skip ci]" && git push)
